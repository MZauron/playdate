name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          # Placeholders: the build only needs the variables to exist (the app fails fast without them). Nothing here is a real key.
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54521
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
          PHONE_HASH_KEY: ci-placeholder-phone-hash-key-0123456789
          PUBLIC_LINK_BASE: https://kindred.test

  # The database tests (supabase/tests: constraints, privileges and who can read what) against a real local Supabase.
  # Realtime stays on: the migration adds tables to its publication.
  db:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Start the local Supabase (only what the tests use)
        run: npx supabase start -x imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - run: npm run test:db
      - name: Stop Supabase
        if: always()
        run: npx supabase stop --no-backup

  # The Phase 1 loop end to end (T11, tests/smoke): a production build against a fresh local Supabase, in WebKit at iPhone size,
  # with fakes (AI, no texts). Realtime, auth and the API are needed; the rest of the stack is left out.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Start the local Supabase
        run: npx supabase start -x imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Install WebKit for Playwright
        run: npx playwright install --with-deps webkit
      - run: npm run test:smoke
      - name: Keep the report and traces when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
      - name: Stop Supabase
        if: always()
        run: npx supabase stop --no-backup

  # src/lib/db/types.ts must be what `npm run db:types` generates from the migrations (same pinned CLI and Postgres as on a laptop).
  # When it differs, the log shows the generated file between the markers: that is the file to commit.
  types:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Start the local Supabase (the type generator needs postgres-meta)
        run: npx supabase start -x imgproxy,mailpit,studio,edge-runtime,logflare,vector,supavisor
      - run: npm run db:types
      - name: Show the generated types
        run: |
          echo "=====BEGIN src/lib/db/types.ts====="
          cat src/lib/db/types.ts
          echo "=====END src/lib/db/types.ts====="
      - name: Check they are committed and up to date
        run: |
          git add -N src/lib/db/types.ts
          git diff --exit-code src/lib/db/types.ts
      - name: Stop Supabase
        if: always()
        run: npx supabase stop --no-backup
